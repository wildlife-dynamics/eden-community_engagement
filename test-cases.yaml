base:
  name: Base Test Case
  description: "Community engagement report with synthetic mock-IO events (see mock-io/)."
  params:
    workflow_details:
      name: "Community Engagement"
      description: ""
    er_client:
      data_source:
        name: "mep_dev"
    time_range:
      timezone:
        label: Africa/Nairobi
        tzCode: EAT
        name: Nairobi
        utc: +03:00
      since: "2025-01-01T00:00:00.000Z"
      until: "2025-12-31T23:59:59.000Z"
    groupers:
      groupers:
        - temporal_index: "__quarter__"
    events:
      event_types:
        - "community_meeting_new"
    event_radius:
      var: 5
    text_layer_size:
      var: 12
